<mat-progress-bar
  *ngIf="isLoading$ | async"
  mode="indeterminate"
></mat-progress-bar>
<div class="flex lg:flex-row flex-col mt-10">
  <div class="m-4">
    <button mat-icon-button (click)="gotoHome()">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>

  <div
    class="flex lg:flex-row flex-col justify-center items-center lg:gap-16 gap-4 w-full mt-10"
  >
    <div>
      <div>Banner Slide Interval</div>
      <div>
        <mat-form-field appearance="outline">
          <input matInput type="number" [formControl]="bannerSlideInterval" />
          <span matTextSuffix>seconds</span>
        </mat-form-field>
      </div>
    </div>
    <div>
      <div>Salah Times Slide Interval</div>
      <div>
        <mat-form-field appearance="outline">
          <input
            matInput
            placeholder="Placeholder"
            [formControl]="salahTimeChangeInterval"
          />
          <span matTextSuffix>seconds</span>
        </mat-form-field>
      </div>
    </div>

    <div class="mb-4 min-w-[124px]">
      <button
        mat-flat-button
        (click)="saveTimeSettings()"
      >
        Save Times
      </button>
    </div>
  </div>
</div>

<banner-upload />
<banner-list />
